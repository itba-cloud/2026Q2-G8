name: Terraform setup
description: >
  Verifica secrets y credenciales del Learner Lab, compila los bundles,
  instala Terraform, crea los buckets (idempotente, solo fuera de PRs) e
  inicializa el backend.
  Las credenciales y las TF_VAR_* llegan por el env del job.

inputs:
  strict:
    description: "'true' falla si faltan secrets/variables; 'false' omite el resto con un warning."
    default: "false"

outputs:
  ready:
    description: "'true' si hay credenciales y variables completas y el setup se ejecutó."
    value: ${{ steps.gate.outputs.ready }}

runs:
  using: composite
  steps:
    # Un único step decide `ready` (los outputs de un step no se pueden pisar después).
    # En pull_request nada falla por credenciales/buckets: se emite un warning y se omite
    # el plan, para que un fork o una sesión del Learner Lab vencida no dejen el PR en rojo.
    # En workflow_dispatch (apply/destroy) un problema de credenciales sí falla el job.
    - name: Verificar secrets, variables y credenciales
      id: gate
      shell: bash
      env:
        STRICT: ${{ inputs.strict }}
        IS_PR: ${{ github.event_name == 'pull_request' }}
      run: |
        missing=()
        for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN \
                 TF_VAR_jwt_secret TF_VAR_bucket_suffix TF_VAR_state_bucket_name \
                 TF_VAR_key_name TF_VAR_bastion_allowed_cidr TF_VAR_sns_subscription_email; do
          [ -n "${!v}" ] || missing+=("$v")
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "$STRICT" = "true" ]; then
            echo "::error title=Faltan secrets o variables::${missing[*]}"
            exit 1
          fi
          echo "::warning title=Plan omitido::Faltan secrets o variables (${missing[*]}). Ver README."
          exit 0
        fi

        if ! aws sts get-caller-identity > /dev/null 2>&1; then
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "$IS_PR" = "true" ]; then
            echo "::warning title=Plan omitido: credenciales vencidas::Las credenciales del Learner Lab vencieron. Actualizá los 3 secrets de AWS y re-ejecutá el job."
            exit 0
          fi
          echo "::error title=Credenciales vencidas::Las credenciales del Learner Lab vencieron. Actualizá los 3 secrets de AWS y re-ejecutá el job."
          exit 1
        fi

        # En PR no se crean buckets (sin efectos secundarios): el state bucket tiene que existir.
        if [ "$IS_PR" = "true" ] && ! aws s3api head-bucket --bucket "$TF_VAR_state_bucket_name" --region "$AWS_REGION" > /dev/null 2>&1; then
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Plan omitido: falta el state bucket::El bucket ${TF_VAR_state_bucket_name} no existe o no es accesible. Corré Actions → Run workflow → apply (o scripts/bootstrap-buckets.sh) primero."
          exit 0
        fi

        echo "ready=true" >> "$GITHUB_OUTPUT"

    - name: Node
      if: steps.gate.outputs.ready == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Compilar bundles (API, alert-processor, Lambda)
      if: steps.gate.outputs.ready == 'true'
      shell: bash
      run: |
        npm ci
        npm run bundle

    - name: Terraform
      if: steps.gate.outputs.ready == 'true'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.10.5
        terraform_wrapper: false

    # Solo en workflow_dispatch: el plan de un PR no debe crear recursos.
    # La región de la réplica del dashboard llega por el env del job
    # (DASHBOARD_REPLICA_REGION), igual que las TF_VAR_*: es opcional y tiene
    # default, así que no entra en la lista de obligatorias del gate.
    - name: Crear buckets (idempotente)
      if: steps.gate.outputs.ready == 'true' && github.event_name != 'pull_request'
      shell: bash
      run: bash scripts/bootstrap-buckets.sh "$TF_VAR_bucket_suffix" "$TF_VAR_state_bucket_name"

    - name: terraform init
      if: steps.gate.outputs.ready == 'true'
      shell: bash
      working-directory: terraform
      run: |
        terraform init -input=false \
          -backend-config="bucket=${TF_VAR_state_bucket_name}" \
          -backend-config="key=snowball/terraform.tfstate" \
          -backend-config="region=${AWS_REGION}"
